[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = [
    "pnpm install --frozen-lockfile",
    "cd apps/web && npx prisma generate"
]

[phases.build]
cmds = [
    "cd apps/web && npx next build"
]

# Explicitly disable the release phase — Nixpacks auto-injects
# "prisma migrate deploy" here when it detects migrations, but
# Railway's internal network is unavailable during Docker build.
[phases.release]
cmds = []

[start]
cmd = "cd apps/web && npx prisma db push --accept-data-loss && npx next start -p ${PORT:-3000}"

[variables]
NODE_ENV = "production"
