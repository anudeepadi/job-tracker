[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = [
    "pnpm install --frozen-lockfile",
    "cd apps/web && npx prisma generate"
]

[phases.build]
cmds = [
    "cd apps/web && npx next build"
]

# No [start] section — start commands are set per-service
# via NIXPACKS_START_CMD env vars to avoid leaking to Docker services.

[phases.release]
cmds = []

[variables]
NODE_ENV = "production"
