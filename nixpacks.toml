[phases.setup]
nixPkgs = ["nodejs_18", "pnpm", "python39", "postgresql"]
aptPkgs = ["build-essential"]

[phases.install]
cmds = [
    "pnpm install --frozen-lockfile",
    "cd apps/web && pnpm prisma generate"
]

[phases.build]
cmds = [
    "cd apps/web && pnpm run build"
]

[start]
cmd = "cd apps/web && npx prisma migrate deploy && pnpm start"

[variables]
NODE_ENV = "production"
NIXPACKS_NO_CACHE = "false"
