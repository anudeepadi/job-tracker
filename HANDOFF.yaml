project:
  name: HireAgent
  description: AI-powered job search platform with multi-agent system
  repo: https://github.com/anudeepadi/effective-barnacle.git
  branch: master

architecture:
  type: pnpm monorepo
  web:
    path: apps/web/
    framework: Next.js 15 (App Router)
    language: TypeScript
    styling: Tailwind CSS + shadcn/ui
    auth: JWT via jose, middleware injects x-user-id header
    database: PostgreSQL via Prisma ORM
    ai: Google Gemini API (GEMINI_API_KEY)
    port: 3000
  agent:
    path: services/job-agent/
    framework: FastAPI + CrewAI
    language: Python 3.12
    ai_agents:
      - Job Search Specialist (Adzuna, LinkedIn, JSearch, RemoteOK)
      - Skills Development Advisor
      - Interview Preparation Coach
      - Career Strategy Advisor
      - Cover Letter Specialist (NEW)
      - Follow-up Email Specialist (NEW)
      - Networking Strategy Advisor (NEW)
    port: 8000

database_models:
  - User, Session, UserPreference
  - Application, Activity, Reminder
  - ApplyTemplate, SearchPreset
  - JobSearch, JobResult, AgentOutput
  - SavedAlert, EmailVerification, PasswordReset
  - Contact (NEW - migration pending on Cloud SQL)

