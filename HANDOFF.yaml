pending_work:
  ci_cd_pipeline:
    status: DESIGNED AND APPROVED, NOT YET IMPLEMENTED
    description: |
      Single GitHub Actions workflow (deploy.yml) that ties production branch
      to automatic GCloud Cloud Run deployment.
    tasks:
      1_create_service_account: |
        gcloud iam service-accounts create github-deployer \
          --display-name="GitHub Actions Deployer" \
          --project=project-d47967a3-e711-43ac-968

        SA=github-deployer@project-d47967a3-e711-43ac-968.iam.gserviceaccount.com
        for ROLE in roles/run.admin roles/artifactregistry.writer roles/cloudbuild.builds.editor roles/iam.serviceAccountUser roles/secretmanager.secretAccessor roles/cloudsql.client; do
          gcloud projects add-iam-policy-binding project-d47967a3-e711-43ac-968 --member="serviceAccount:$SA" --role="$ROLE"
        done
      2_workload_identity_federation: |
        gcloud iam workload-identity-pools create github-actions-pool \
          --location="global" --display-name="GitHub Actions Pool" \
          --project=project-d47967a3-e711-43ac-968

        gcloud iam workload-identity-pools providers create-oidc github-provider \
          --location="global" --workload-identity-pool="github-actions-pool" \
          --display-name="GitHub OIDC" \
          --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.actor=assertion.actor" \
          --attribute-condition="assertion.repository=='anudeepadi/effective-barnacle'" \
          --issuer-uri="https://token.actions.githubusercontent.com" \
          --project=project-d47967a3-e711-43ac-968

        # Then bind SA to pool:
        POOL_ID=$(gcloud iam workload-identity-pools describe github-actions-pool --location=global --format="value(name)" --project=project-d47967a3-e711-43ac-968)
        gcloud iam service-accounts add-iam-policy-binding $SA \
          --role="roles/iam.workloadIdentityUser" \
          --member="principalSet://iam.googleapis.com/${POOL_ID}/attribute.repository/anudeepadi/effective-barnacle" \
          --project=project-d47967a3-e711-43ac-968
      3_github_secrets: |
        gh secret set GCP_PROJECT_ID --body "project-d47967a3-e711-43ac-968"
        gh secret set GCP_WIF_PROVIDER --body "<output from step 2>"
        gh secret set GCP_SERVICE_ACCOUNT --body "github-deployer@project-d47967a3-e711-43ac-968.iam.gserviceaccount.com"
      4_create_deploy_yml: |
        Create .github/workflows/deploy.yml with 5 jobs:
        - lint (all branches): pnpm lint + ruff + black
        - test (all branches): pnpm test + pytest
        - docker-build (all branches): build both Dockerfiles, push only on production
        - security-scan (all branches): Trivy HIGH/CRITICAL
        - deploy (production only): prisma migrate via Cloud SQL proxy + gcloud run deploy + health check
      5_branch_setup: |
        git branch -m master production
        git push origin production
        git push origin --delete master
        gh api repos/anudeepadi/effective-barnacle -X PATCH -f default_branch=production
        git checkout -b development
        git push -u origin development
      6_branch_protection: |
        gh api repos/anudeepadi/effective-barnacle/branches/production/protection -X PUT \
          -F "required_status_checks[strict]=true" \
          -F "required_status_checks[contexts][]=lint" \
          -F "required_status_checks[contexts][]=test" \
          -F "required_status_checks[contexts][]=docker-build" \
          -F "required_status_checks[contexts][]=security-scan" \
          -F "enforce_admins=false" \
          -F "required_pull_request_reviews[required_approving_review_count]=0" \
          -F "restrictions=null"

  manual_deploy_now:
    description: Deploy latest code to GCloud without CI/CD
    steps:
      1_migrate_db: |
        # Start Cloud SQL proxy
        /tmp/cloud-sql-proxy --port 5433 project-d47967a3-e711-43ac-968:us-central1:jobtracker-db &
        sleep 5
        # Apply migration for Contact model
        cd apps/web
        DB_PASSWORD=$(gcloud secrets versions access latest --secret=db-password)
        ENCODED_PASSWORD=$(python3 -c "import urllib.parse; import sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$DB_PASSWORD")
        DATABASE_URL="postgresql://jobtracker_app:${ENCODED_PASSWORD}@localhost:5433/jobtracker" npx prisma migrate deploy
        kill %1
      2_build_and_deploy: |
        gcloud builds submit --config cloudbuild.web.yaml .
        gcloud builds submit --config cloudbuild.agent.yaml .
        gcloud run deploy jobtracker-web --image=us-central1-docker.pkg.dev/project-d47967a3-e711-43ac-968/jobtracker/web:latest --region=us-central1 --allow-unauthenticated
        gcloud run deploy jobtracker-agent --image=us-central1-docker.pkg.dev/project-d47967a3-e711-43ac-968/jobtracker/agent:latest --region=us-central1 --allow-unauthenticated
      3_verify: |
        curl -s https://jobtracker-web-987688822880.us-central1.run.app/api/health | jq .
        curl -s https://jobtracker-agent-987688822880.us-central1.run.app/health | jq .

  env_vars_needed:
    web:
      - NEXT_PUBLIC_SENTRY_DSN (optional, enables Sentry error tracking)
      - SENTRY_DSN (optional, server-side Sentry)
      - LOG_LEVEL (optional, default: info)
    agent:
      - SENTRY_DSN (optional, enables Sentry)

local_dev:
  start: ./dev.sh  # starts Docker DB + both services
  ports:
    database: 5433
    web: 3000
    agent: 8000
  test_web: cd apps/web && pnpm test
  test_agent: cd services/job-agent && pytest -v
  test_e2e: cd apps/web && pnpm test:e2e

