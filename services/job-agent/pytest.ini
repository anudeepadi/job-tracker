[pytest]
# =============================================================================
# pytest configuration for Job Agent API testing
# =============================================================================

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Paths to search for tests
testpaths = tests

# Minimum pytest version
minversion = 7.0

# Add project root to Python path
pythonpath = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --cov=app
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=70
    --asyncio-mode=auto
    -W ignore::DeprecationWarning

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may call external APIs)
    slow: Slow-running tests
    asyncio: Asynchronous tests
    crew: Tests for CrewAI service
    tools: Tests for API tools (Adzuna, LinkedIn, JSearch, RemoteOK)
    api: Tests for FastAPI endpoints
    store: Tests for job store CRUD operations

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration (also read from pyproject.toml if present)
[coverage:run]
source = app,src
branch = True
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */site-packages/*
    */__init__.py
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
