services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: job-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_dev_password
      POSTGRES_DB: jobtracker
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-tracker-network

volumes:
  postgres_data:
    driver: local

networks:
  job-tracker-network:
    driver: bridge
