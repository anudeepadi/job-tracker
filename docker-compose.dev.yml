# =============================================================================
# Development Docker Compose Configuration
# =============================================================================
# Fast-feedback development setup with hot reloading and debugging support.
# Use for local development when you need to test containerized services.
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up
#   docker-compose -f docker-compose.dev.yml down
#   docker-compose -f docker-compose.dev.yml logs -f web
#
# Features:
# - Hot reload for both web and API services
# - Source code mounted as volumes
# - Debug logging enabled
# - Optimized for development speed
# =============================================================================

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: job-tracker-db-dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_dev_password
      POSTGRES_DB: jobtracker
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - job-tracker-network

  # FastAPI Job Agent (Development mode with reload)
  job-agent:
    build:
      context: ./services/job-agent
      dockerfile: Dockerfile.agent
      target: development

    image: job-agent:dev
    container_name: job-agent-api-dev
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: debug

    ports:
      - "8000:8000"

    volumes:
      # Mount entire service directory for hot reload
      - ./services/job-agent:/app
      - /app/.venv
      - /app/__pycache__

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - job-tracker-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Next.js Web Application (Development mode)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder

    image: web:dev
    container_name: job-tracker-web-dev
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHON_BACKEND_URL: http://job-agent:8000

    ports:
      - "3000:3000"

    volumes:
      # Mount source code for hot reload
      - ./apps/web:/app
      # Exclude node_modules from bind mount
      - /app/node_modules
      - /app/.next

    depends_on:
      postgres:
        condition: service_healthy
      job-agent:
        condition: service_healthy

    networks:
      - job-tracker-network

    command: pnpm dev

volumes:
  postgres_data_dev:
    driver: local

networks:
  job-tracker-network:
    driver: bridge
