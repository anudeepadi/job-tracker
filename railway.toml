[build]
builder = "nixpacks"
buildCommand = "pnpm install && cd apps/web && pnpm prisma generate && pnpm run build"

[deploy]
startCommand = "cd apps/web && npx prisma migrate deploy && pnpm start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.deploy]
numReplicas = 1
